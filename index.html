<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offended | Member Directory</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --surface: #0f0f0f; --primary: #ffffff; --accent: #3d5afe; --border: rgba(255, 255, 255, 0.08); }
        body { background: var(--bg); color: var(--primary); font-family: 'Plus Jakarta Sans', sans-serif; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0; letter-spacing: -2px; text-transform: uppercase; background: linear-gradient(to bottom, #fff, #444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-container { width: 100%; max-width: 600px; position: sticky; top: 20px; z-index: 100; margin-bottom: 40px; }
        #search { width: 100%; padding: 18px 25px; border-radius: 12px; border: 1px solid var(--border); background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(12px); color: white; font-size: 16px; outline: none; transition: 0.3s; }
        #search:focus { border-color: var(--accent); box-shadow: 0 0 25px rgba(61, 90, 254, 0.2); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; width: 100%; max-width: 1200px; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 25px; border-radius: 15px; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; height: 160px; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .name { font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user { color: var(--accent); font-family: monospace; font-size: 13px; margin-bottom: 15px; display: block; }
        .btn { background: white; color: black; text-decoration: none; text-align: center; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; transition: 0.2s; }
        .btn:hover { background: var(--accent); color: white; }
        .loading { font-weight: 600; color: #444; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header>
        <h1>Offended database</h1>
        <div id="status" class="loading">SYNCING DATABASE...</div>
    </header>

    <div class="search-container">
        <input type="text" id="search" placeholder="Search 1,500+ members...">
    </div>

    <div class="grid" id="grid"></div>

    <script>
        let users = [];
        const grid = document.getElementById('grid');
        const status = document.getElementById('status');

        // This part reads the CSV file directly from your GitHub
        Papa.parse('group_users.csv', {
            download: true,
            header: true,
            complete: function(results) {
                users = results.data.filter(u => u.name); // Filter empty rows
                render(users);
                status.innerText = users.length + " MEMBERS ACTIVE";
            }
        });

        function render(items) {
            grid.innerHTML = items.map(u => `
                <div class="card">
                    <div>
                        <div class="name">${u.name || 'Unknown'}</div>
                        <span class="user">${u.username || ''}</span>
                    </div>
                    <a href="${u.link}" target="_blank" class="btn">OPEN PROFILE</a>
                </div>
            `).join('');
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = users.filter(u => 
                (u.name && u.name.toLowerCase().includes(val)) || 
                (u.username && u.username.toLowerCase().includes(val))
            );
            render(filtered);
        });
    </script>
</body>
</html>
